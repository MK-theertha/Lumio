name: CD

# Images are built once here and promoted by digest, so production runs exactly what was tested.
# Requires GitHub Environments "development", "staging" and "production", each with the secrets
# DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY and vars HEALTH_URL. Add required reviewers to production.

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: api, dockerfile: apps/backend/Dockerfile, target: api }
          - { name: worker, dockerfile: apps/backend/Dockerfile, target: worker }
          - { name: frontend, dockerfile: apps/frontend/Dockerfile, target: prod }
    outputs:
      api: ${{ steps.export.outputs.api }}
      worker: ${{ steps.export.outputs.worker }}
      frontend: ${{ steps.export.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
      - id: export
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.name }}@${{ steps.build.outputs.digest }}"
          echo "${{ matrix.name }}=$image" >> "$GITHUB_OUTPUT"

  development:
    needs: publish
    uses: ./.github/workflows/deploy.yml
    with:
      environment: development
      api_image: ${{ needs.publish.outputs.api }}
      worker_image: ${{ needs.publish.outputs.worker }}
      frontend_image: ${{ needs.publish.outputs.frontend }}
    secrets: inherit

  staging:
    needs: [publish, development]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      api_image: ${{ needs.publish.outputs.api }}
      worker_image: ${{ needs.publish.outputs.worker }}
      frontend_image: ${{ needs.publish.outputs.frontend }}
    secrets: inherit

  production:
    needs: [publish, staging]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      api_image: ${{ needs.publish.outputs.api }}
      worker_image: ${{ needs.publish.outputs.worker }}
      frontend_image: ${{ needs.publish.outputs.frontend }}
    secrets: inherit
