name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run boundaries
      - run: npm run openapi:check
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build
      - run: npm audit --audit-level=high --omit=dev

  images:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: api, dockerfile: apps/backend/Dockerfile, target: api }
          - { name: worker, dockerfile: apps/backend/Dockerfile, target: worker }
          - { name: frontend, dockerfile: apps/frontend/Dockerfile, target: prod }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          load: true
          tags: lumio-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Scan image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: lumio-${{ matrix.name }}:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Confirm the container is non-root
        run: test "$(docker image inspect lumio-${{ matrix.name }}:ci --format '{{.Config.User}}')" != ""
